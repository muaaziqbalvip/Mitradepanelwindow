name: 100% Free Direct High-Speed VPN (No Credit Card)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  high-speed-vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Linux Kernel BBR Speed Boost (Fast Speed ke liye)
      - name: Boost Network & Enable Google BBR
        run: |
          sudo modprobe tcp_bbr
          echo "net.core.default_qdisc=fq" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_congestion_control=bbr" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      # 2. Xray Core Install Karna
      - name: Install High Performance Xray Core
        run: |
          wget -q -O xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          sudo unzip -q xray.zip -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray

      # 3. Direct Fast TCP VLESS Server Configure Karna
      - name: Configure Fast TCP VPN Server
        run: |
          cat << 'EOF' > /tmp/config.json
          {
            "log": { "loglevel": "none" },
            "dns": {
              "servers": ["tcp+local://1.1.1.1", "tcp+local://8.8.8.8"]
            },
            "inbounds": [
              {
                "port": 4433,
                "protocol": "vless",
                "settings": {
                  "clients": [
                    { "id": "b831381d-6324-4d53-ad4f-8cda48b30811", "flow": "" }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "tcp"
                }
              }
            ],
            "outbounds": [
              { "protocol": "freedom" }
            ]
          }
          EOF
          /usr/local/bin/xray run -c /tmp/config.json &
          echo "Xray TCP Server Running on Port 4433"

      # 4. Direct Free TCP Tunnel (No Card, No Signup)
      - name: Start Free Direct TCP Tunnel
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:4433 tcp@free.pinggy.io 2>&1 | tee /tmp/pinggy.log &
          
          echo "Waiting for Direct TCP Address..."
          raw_url=""
          for i in {1..30}; do
            raw_url=$(grep -o 'tcp://[a-zA-Z0-9.-]*:[0-9]*' /tmp/pinggy.log | head -n 1)
            if [ -n "$raw_url" ]; then
              break
            fi
            sleep 2
          done
          
          if [ -z "$raw_url" ]; then
            echo "Pinggy Log:"
            cat /tmp/pinggy.log
            exit 1
          fi
          
          CLEAN_ADDR=$(echo $raw_url | sed 's/tcp:\/\///')
          HOST=$(echo $CLEAN_ADDR | cut -d: -f1)
          PORT=$(echo $CLEAN_ADDR | cut -d: -f2)
          
          # DIRECT HIGH SPEED VLESS KEY
          VLESS_KEY="vless://b831381d-6324-4d53-ad4f-8cda48b30811@${HOST}:${PORT}?type=tcp&security=none#Direct_Super_Speed"
          
          echo "## ⚡ Direct High-Speed Cloud Internet Ready!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 Apne Mobile v2rayNG mein ye Key Paste karein:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          echo "$VLESS_KEY" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          echo "=================================================================="
          echo "🎉 HIGH SPEED KEY: $VLESS_KEY"
          echo "=================================================================="

      # 5. Keep Alive (5.5 Hours)
      - name: Keep Server Active
        run: |
          sleep 18000
