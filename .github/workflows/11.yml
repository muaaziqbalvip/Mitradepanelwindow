name: Ultra High-Speed Gigabit VPN (Fixed Domain & BBR Boost)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  gigabit-vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Linux Kernel BBR Speed Boost (1 Gbps+ Acceleration)
      - name: Boost Network & Enable Google BBR
        run: |
          sudo modprobe tcp_bbr
          echo "net.core.default_qdisc=fq" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_congestion_control=bbr" | sudo tee -a /etc/sysctl.conf
          echo "net.core.rmem_max=67108864" | sudo tee -a /etc/sysctl.conf
          echo "net.core.wmem_max=67108864" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_rmem=4096 87380 33554432" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_wmem=4096 65536 33554432" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      # 2. Install Xray Gigabit Core
      - name: Install High Performance Xray Core
        run: |
          wget -q -O xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          sudo unzip -q xray.zip -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray

      # 3. Configure Ultra Fast VLESS TCP Server
      - name: Configure Gigabit VPN Server
        run: |
          cat << 'EOF' > /tmp/config.json
          {
            "log": { "loglevel": "none" },
            "dns": {
              "servers": ["tcp+local://1.1.1.1", "tcp+local://8.8.8.8"]
            },
            "inbounds": [
              {
                "port": 4433,
                "protocol": "vless",
                "settings": {
                  "clients": [
                    { "id": "b831381d-6324-4d53-ad4f-8cda48b30811", "flow": "" }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "tcp"
                }
              }
            ],
            "outbounds": [
              { "protocol": "freedom", "settings": { "domainStrategy": "UseIP" } }
            ]
          }
          EOF
          /usr/local/bin/xray run -c /tmp/config.json &
          echo "Gigabit Xray Running on Port 4433"

      # 4. Ngrok High-Speed TCP Tunnel (Fixed Speed & Port)
      - name: Start High-Speed Tunnel
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install -y ngrok
          
          if [ -n "$NGROK_TOKEN" ]; then
            ngrok config add-authtoken "$NGROK_TOKEN"
            ngrok tcp 4433 --log=stdout > /tmp/ngrok.log &
            sleep 4
            RAW_ADDR=$(grep -o 'tcp://[^ ]*' /tmp/ngrok.log | head -n 1 | sed 's/tcp:\/\///')
            HOST=$(echo $RAW_ADDR | cut -d: -f1)
            PORT=$(echo $RAW_ADDR | cut -d: -f2)
            
            VLESS_KEY="vless://b831381d-6324-4d53-ad4f-8cda48b30811@${HOST}:${PORT}?type=tcp&security=none#Gigabit_Direct_Speed"
            
            echo "## ⚡ 1 Gbps Gigabit Direct Speed Ready!" >> $GITHUB_STEP_SUMMARY
            echo "### 📱 v2rayNG Key:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
            echo "$VLESS_KEY" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Please add NGROK_AUTHTOKEN in GitHub Secrets for Gigabit Direct Speed."
            exit 1
          fi

      # 5. Keep Alive
      - name: Keep Server Active
        run: |
          sleep 18000
