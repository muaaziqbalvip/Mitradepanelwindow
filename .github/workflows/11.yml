name: 100% Working Cloud VPN

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  working-vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. BBR Speed Optimization
      - name: Enable BBR
        run: |
          sudo modprobe tcp_bbr
          echo "net.core.default_qdisc=fq" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_congestion_control=bbr" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      # 2. Xray Core Install Karna
      - name: Install Xray
        run: |
          wget -q -O xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          sudo unzip -q xray.zip -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray

      # 3. Fast WebSocket Server Setup
      - name: Configure Server
        run: |
          cat << 'EOF' > /tmp/config.json
          {
            "log": { "loglevel": "none" },
            "dns": {
              "servers": ["tcp+local://1.1.1.1", "tcp+local://8.8.8.8"]
            },
            "inbounds": [
              {
                "port": 8080,
                "protocol": "vless",
                "settings": {
                  "clients": [
                    { "id": "b831381d-6324-4d53-ad4f-8cda48b30811" }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": { "path": "/cloud-net" }
                }
              }
            ],
            "outbounds": [{ "protocol": "freedom" }]
          }
          EOF
          /usr/local/bin/xray run -c /tmp/config.json &
          echo "Server Running"

      # 4. Cloudflare Tunnel Start Karna
      - name: Start Cloudflare Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          cloudflared tunnel --url http://localhost:8080 2> /tmp/cloudflared.log &
          
          domain=""
          for i in {1..30}; do
            domain=$(grep -o '[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1)
            if [ -n "$domain" ]; then
              break
            fi
            sleep 2
          done
          
          # 100% COMPLETE WORKING KEY (WITH FULL TLS & HEADERS)
          VLESS_KEY="vless://b831381d-6324-4d53-ad4f-8cda48b30811@${domain}:443?type=ws&security=tls&sni=${domain}&host=${domain}&path=%2Fcloud-net#CloudNet_US_Fast"
          
          echo "## 🚀 100% Working Cloud VPN Ready!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 v2rayNG mein ye Key Paste karein:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          echo "$VLESS_KEY" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          echo "=================================================================="
          echo "🎉 KEY: $VLESS_KEY"
          echo "=================================================================="

      # 5. Keep Alive
      - name: Keep Server Active
        run: |
          sleep 18000
