name: Direct IP High-Speed VPN

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  direct-vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # BBR Speed Boost
      - name: Enable BBR & Full Kernel Speed Tuning
        run: |
          sudo modprobe tcp_bbr
          echo "net.core.default_qdisc=fq" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_congestion_control=bbr" | sudo tee -a /etc/sysctl.conf
          echo "net.core.rmem_max=134217728" | sudo tee -a /etc/sysctl.conf
          echo "net.core.wmem_max=134217728" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_rmem=4096 87380 67108864" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_wmem=4096 65536 67108864" | sudo tee -a /etc/sysctl.conf
          echo "net.ipv4.tcp_mtu_probing=1" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      # Xray Install
      - name: Install Xray Core
        run: |
          wget -q -O xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          sudo unzip -q xray.zip -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray

      # VLESS Server Configure
      - name: Configure Xray VLESS Server
        run: |
          cat > /tmp/config.json << 'EOF'
          {
            "log": { "loglevel": "none" },
            "dns": { "servers": ["tcp+local://1.1.1.1","tcp+local://8.8.8.8"] },
            "inbounds": [{
              "port": 4433,
              "protocol": "vless",
              "settings": {
                "clients": [{ "id": "b831381d-6324-4d53-ad4f-8cda48b30811" }],
                "decryption": "none"
              },
              "streamSettings": { "network": "tcp" }
            }],
            "outbounds": [{ "protocol": "freedom" }]
          }
          EOF
          /usr/local/bin/xray run -c /tmp/config.json &

      # Get Direct Public IP (No Tunnel - Full Speed)
      - name: Get Direct Server IP & Generate Key
        run: |
          # Firewall open karna
          sudo iptables -I INPUT -p tcp --dport 4433 -j ACCEPT
          
          # Direct Public IP nikalna
          SERVER_IP=$(curl -s https://api.ipify.org)
          echo "Server IP: $SERVER_IP"
          
          # Direct Full-Speed VLESS Key (Koi tunnel nahi)
          VLESS_KEY="vless://b831381d-6324-4d53-ad4f-8cda48b30811@${SERVER_IP}:4433?type=tcp&security=none&packetEncoding=xudp#GitHub_FULL_SPEED_$(date +%H%M)"
          
          echo "## ⚡ FULL SPEED Direct GitHub Cloud VPN!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server IP:** \`${SERVER_IP}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 v2rayNG Key:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$VLESS_KEY" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          echo "🎉 FULL SPEED KEY: $VLESS_KEY"

      # Keep Alive
      - name: Keep VPN Running
        run: sleep 18000
