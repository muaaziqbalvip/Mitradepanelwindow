name: 24/7 Fullscreen Ultra Fast Android Mobile

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *' # 24/7 active rakhne ke liye

jobs:
  cloud-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 5.5 Hours runtime

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. KVM Hardware Acceleration Setup
      - name: Enable KVM Hardware Engine
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils

      # 2. Node.js & Fast Web Scrcpy Engine Install Karna
      - name: Setup Node.js & Web Scrcpy Engine
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install and Build ws-scrcpy (Full Mobile Touch Engine)
        run: |
          git clone https://github.com/NetrisTV/ws-scrcpy.git
          cd ws-scrcpy
          npm install
          npm run dist
          nohup npm start > ../scrcpy.log 2>&1 &
          cd ..

      # 3. Cloudflare Tunnel Install & Start Karna
      - name: Start Cloudflare Web Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared tunnel --url http://localhost:8000 > tunnel.log 2>&1 &
          sleep 6

      # 4. Official Google Play Store Android Emulator Run Karna
      - name: Launch Android Phone with Google Play Store
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30                                 # Stable Android Version
          target: google_apis_playstore                 # Official Google Play Store Target
          arch: x86_64
          profile: pixel_5                              # Smartphone Mobile Profile
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          
          script: |
            echo "Waiting for Android Device to Boot..."
            adb wait-for-device
            
            # Mobile Screen Orientation & Smooth Settings
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            
            echo "================================================================"
            echo "🚀 AAPKA FULLSCREEN REAL MOBILE TAIYAR HAI! 🚀"
            echo "👇 APNE MOBILE BROWSER MEIN YE LINK KHOLEIN 👇"
            grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' tunnel.log || cat tunnel.log
            echo "================================================================"
            
            # Session ko 5 ghante tak online rakhna
            sleep 18000
